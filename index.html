<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Events Exercise</title>

	<link rel="stylesheet" href="style.css">
	<script src="script.js"></script>
</head>

<body>
	<form id="color-form">
		<label for="color-input">Note Color:</label>
		<input type="text" id="color-input" placeholder="black, rgb(0, 0, 0), #000000">

		<button type="submit">Set as New Color</button>
	</form>
	<form id="note-form">
		<label for="color-input">Note:</label>
		<input type="text" id="note-input" placeholder="Enter Note...">

		<button type="submit">New Note</button>
	</form>


	<button id="clear-button">CLEAR ALL</button>

	<div id="note-container">
	</div>
</body>

</html>
